---
- name: AutoOps - collect observed state (read-only)
  hosts: all
  become: true
  vars_files:
    - ../../config/users.yml
    - ../../config/services.yml
    - ../../config/packages.yml
    - ../../config/server_baseline.yml
  pre_tasks:
    - name: Safety guard
      ansible.builtin.import_tasks: ../tasks/guard.yml
  roles:
    - role: compliance
