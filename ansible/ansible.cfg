[defaults]
inventory = inventory/localhost.yml
roles_path = roles
host_key_checking = True
retry_files_enabled = False
forks = 2
gathering = smart
interpreter_python = auto_silent
nocows = True
# NOTE: Ansible ignores this file if the directory is world-writable (e.g. /mnt/d in WSL).
# Use:  export ANSIBLE_CONFIG="$PWD/ansible/ansible.cfg"   or work from a copy under ~/

[privilege_escalation]
become = False
