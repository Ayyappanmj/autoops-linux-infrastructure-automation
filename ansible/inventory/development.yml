---
# Development server. Placeholder values only: 192.0.2.0/24 is reserved for documentation.
# Replace ansible_host / ansible_user with your disposable test VM. Never put passwords here:
# use SSH keys (ansible_ssh_private_key_file is a PATH) and Ansible Vault for anything secret.
all:
  children:
    development:
      hosts:
        dev-ubuntu-01:
          ansible_host: 192.0.2.10
          ansible_user: devops
          ansible_port: 22
          ansible_become: true
          ansible_become_method: sudo
          ansible_ssh_private_key_file: ~/.ssh/autoops_dev_ed25519
          ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
      vars:
        autoops_environment: development
