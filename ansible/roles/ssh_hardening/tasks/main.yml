---
- name: Assert SSH policy is loaded
  ansible.builtin.assert:
    that:
      - ssh_policy is defined
      - ssh_policy.settings is defined
    fail_msg: "ssh_policy missing: run via playbooks/security.yml (vars_files)"
    quiet: true

- name: Decide whether PasswordAuthentication may be changed
  ansible.builtin.set_fact:
    ssh_hardening_password_blocked: >-
      {{ (ssh_policy.settings.PasswordAuthentication | default('yes')) == 'no'
         and not ((ssh_policy.allow_password_auth_disable | default(false) | bool)
                  and (autoops_key_access_verified | bool)) }}

- name: Build the effective setting list (lockout-prone setting withheld unless doubly opted in)
  ansible.builtin.set_fact:
    ssh_hardening_effective: >-
      {{ (ssh_policy.settings | dict2items | rejectattr('key', 'equalto', 'PasswordAuthentication') | list | items2dict)
         if (ssh_hardening_password_blocked | bool) else ssh_policy.settings }}

- name: Warn that PasswordAuthentication is being left unchanged
  ansible.builtin.debug:
    msg: >-
      PasswordAuthentication is NOT being changed. To disable it you must verify key-based login,
      then set ssh_policy.allow_password_auth_disable=true AND pass -e autoops_key_access_verified=true.
  when: ssh_hardening_password_blocked | bool

- name: Refuse settings that could lock everyone out
  ansible.builtin.assert:
    that:
      - ssh_hardening_effective.PubkeyAuthentication | default('yes') == 'yes'
      - ssh_hardening_effective.Port is not defined
    fail_msg: "Refusing: PubkeyAuthentication must stay 'yes' and Port must not be changed by AutoOps."
    quiet: true

- name: Report mode (audit only)
  ansible.builtin.debug:
    msg: "ssh_policy.apply_changes is false: AUDIT ONLY. Nothing will be written. Would apply: {{ ssh_hardening_effective }}"
  when: not (ssh_policy.apply_changes | default(false) | bool)

- name: Apply SSH hardening (validated, backed up, reload only)
  when: ssh_policy.apply_changes | default(false) | bool
  block:
    - name: Confirm sshd_config exists
      ansible.builtin.stat:
        path: "{{ ssh_hardening_main_config }}"
      register: ssh_hardening_main_stat

    - name: Assert sshd_config exists
      ansible.builtin.assert:
        that: ssh_hardening_main_stat.stat.exists
        fail_msg: "{{ ssh_hardening_main_config }} not found; is openssh-server installed?"
        quiet: true

    - name: Verify sshd_config includes the drop-in directory
      ansible.builtin.command:
        argv:
          - grep
          - -Eq
          - '^[[:space:]]*Include[[:space:]]+/etc/ssh/sshd_config\.d/'
          - "{{ ssh_hardening_main_config }}"
      register: ssh_hardening_include
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Refuse to continue if drop-ins are not honoured
      ansible.builtin.assert:
        that: ssh_hardening_include.rc == 0
        fail_msg: >-
          {{ ssh_hardening_main_config }} has no 'Include /etc/ssh/sshd_config.d/*.conf' line, so the drop-in
          would be ignored. Add it manually (keep a session open) and re-run.
        quiet: true

    - name: Create backup directory
      ansible.builtin.file:
        path: "{{ ssh_hardening_backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Preserve the ORIGINAL sshd_config once (never overwritten)
      ansible.builtin.copy:
        src: "{{ ssh_hardening_main_config }}"
        dest: "{{ ssh_hardening_backup_dir }}/sshd_config.original"
        remote_src: true
        force: false
        owner: root
        group: root
        mode: "0600"

    - name: Keep a timestamped copy of sshd_config for this run
      ansible.builtin.copy:
        src: "{{ ssh_hardening_main_config }}"
        dest: "{{ ssh_hardening_backup_dir }}/sshd_config.{{ ansible_facts.date_time.iso8601_basic_short }}"
        remote_src: true
        force: false
        owner: root
        group: root
        mode: "0600"

    - name: Install the AutoOps SSH drop-in (syntax-validated before it is placed)
      ansible.builtin.template:
        src: 00-autoops.conf.j2
        dest: "{{ ssh_hardening_dropin }}"
        owner: root
        group: root
        mode: "0644"
        validate: "{{ ssh_hardening_sshd_bin }} -t -f %s"
      notify: Reload ssh

    - name: Validate the complete effective sshd configuration
      ansible.builtin.command: "{{ ssh_hardening_sshd_bin }} -t"
      changed_when: false
      check_mode: false

    - name: Reload ssh now (reload keeps existing sessions alive; never a blind restart)
      ansible.builtin.meta: flush_handlers

    - name: Confirm we can still reach the host after the reload
      ansible.builtin.wait_for_connection:
        timeout: 30

  rescue:
    - name: Roll back - remove the AutoOps drop-in
      ansible.builtin.file:
        path: "{{ ssh_hardening_dropin }}"
        state: absent

    - name: Roll back - confirm remaining configuration is valid
      ansible.builtin.command: "{{ ssh_hardening_sshd_bin }} -t"
      changed_when: false
      check_mode: false

    - name: Fail with a clear message after rollback
      ansible.builtin.fail:
        msg: "SSH hardening failed and the AutoOps drop-in was removed. Original config backups: {{ ssh_hardening_backup_dir }}"
